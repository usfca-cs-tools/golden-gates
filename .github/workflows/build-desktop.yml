name: Build Desktop App

on:
  push:
    branches: [ main ]        # rolling 'latest' development build
    tags: [ 'v*' ]            # a tag push cuts a permanent, named (stable) release
    # No `paths:` filter on purpose: a `paths` filter also gates tag pushes (whose
    # changed-file set is unreliable), which would silently skip releases. Every push
    # to main therefore builds; the concurrency group below coalesces rapid pushes.
  workflow_dispatch: {}        # allow manual rolling builds from the Actions tab

concurrency:
  # Per-ref so a main build and a tag (release) build never cancel each other;
  # rapid pushes to the same ref still supersede.
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write             # the release job publishes to GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon runner -> arm64
            platform: mac
          - os: windows-latest    # x64 runner
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The build needs the ggl engine (vite copies ggl-engine/src/ggl).
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Generate Windows app icon
        working-directory: web
        run: npm run icon

      - name: Build web app (vite)
        working-directory: web
        run: npm run build

      - name: Generate build info
        id: buildinfo
        working-directory: web
        shell: bash
        env:
          # Presence of the Developer ID secret on a tag build flips build-info `signed`
          # true, which is what enables auto-update in the app. Empty until configured.
          CSC_LINK: ${{ secrets.CSC_LINK }}
        # Writes web/build-info.json (channel/id/sha/date/signed -> the About box + updater)
        # and emits `version` (the semver electron-builder should stamp): the tag for a tag
        # push, 0.0.0-dev.<run> for a rolling main build.
        run: node scripts/gen-build-info.cjs

      - name: Package Electron app
        working-directory: web
        shell: bash
        env:
          # macOS Developer ID cert + notarization credentials. All empty until the repo
          # secrets are added (see README "Code signing"), so the build stays ad-hoc.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: electron-builder signs automatically when these are set.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Build number -> 4th component of the Windows file version and the
          # macOS CFBundleVersion. Monotonic per workflow run.
          BUILD_NUMBER: ${{ github.run_number }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          # Stamp the computed version so the artifact filename and CFBundleVersion
          # reflect the build (tag -> the tag, e.g. GoldenGates-1.0.0-...; rolling ->
          # GoldenGates-0.0.0-dev.<run>-...) instead of the static package.json 0.0.1.
          VERSION_ARG=""
          if [ -n "${{ steps.buildinfo.outputs.version }}" ]; then
            VERSION_ARG="--config.extraMetadata.version=${{ steps.buildinfo.outputs.version }}"
          fi

          # Sign + notarize ONLY a tagged (stable) release, and ONLY once the Developer ID
          # secret exists. Everything else (rolling builds, the pre-cert period) stays
          # ad-hoc — identical to today. On the signed path the afterPack hook stands down
          # and the notarize afterSign hook runs (both keyed on these env vars).
          SIGN_ARGS=""
          if [ "$IS_TAG" = "true" ] && [ -n "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            SIGN_ARGS="--config.mac.hardenedRuntime=true --config.mac.gatekeeperAssess=false"
            echo "macOS: Developer ID signing + notarization (tagged release)"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            echo "macOS: ad-hoc signing (rolling build or Developer ID not configured yet)"
          fi

          npx electron-builder --${{ matrix.platform }} $VERSION_ARG $SIGN_ARGS --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: golden-gates-${{ matrix.platform }}
          path: |
            web/release/*.dmg
            web/release/*.zip
            web/release/*.exe
            web/release/latest*.yml
            web/release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish rolling 'latest' prerelease (development build)
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name 'latest*.yml' -o -name '*.blockmap' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts found to release" >&2
            exit 1
          fi
          printf 'Releasing asset: %s\n' "${files[@]}"
          # Recreate 'latest' so it always points at the newest main build while
          # keeping a stable download URL (tag + filenames).
          gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create latest "${files[@]}" \
            --repo "$REPO" \
            --target "$SHA" \
            --prerelease \
            --title "Latest development build" \
            --notes "Rolling build from \`main\` (${SHA}). This is a DEVELOPMENT build — unvetted and possibly unstable (the About box says so). For a build known to be usable, use a tagged release. Ad-hoc signed (macOS) / unsigned (Windows) — see the README for how to open them."

      - name: Publish tagged release (stable)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name 'latest*.yml' -o -name '*.blockmap' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts found to release" >&2
            exit 1
          fi
          printf 'Releasing asset: %s\n' "${files[@]}"
          # The tag already exists (it triggered this run) — create its release.
          gh release create "$TAG" "${files[@]}" \
            --repo "$REPO" \
            --title "Golden Gates $TAG" \
            --notes "Tagged release \`$TAG\`. Ad-hoc signed (macOS) / unsigned (Windows) — see the README for how to open them."
